name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The build only needs to read the repo; artifacts upload uses a separate service token.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # Only this job may sign build provenance (attestations); the workflow default above stays read-only.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # the build never pushes, so no token is left in the runner's git config

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore
          dotnet restore tests/BgOptimizer.Tests

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/BgOptimizer.Tests --no-restore --configuration Release

      - name: Publish artifact
        run: dotnet publish --no-restore --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BgOptimizer
          path: publish/

      # The installer is unsigned: SmartScreen / Smart App Control will warn about it until the
      # exe, dll and Setup.exe are code-signed.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content BgOptimizer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> found in BgOptimizer.csproj' }

          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) {
              choco install innosetup --yes --no-progress
              $found = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
            $iscc = $found
          } else { $iscc = $iscc.Source }

          & $iscc /Qp "/DAppVersion=$version" installer/BgOptimizer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BgOptimizer-Setup
          path: installer/Output/*.exe
          if-no-files-found: error

      # The release files, built here so the published download is exactly what CI built (and what the
      # attestation below vouches for), not something repackaged by hand on a developer machine.
      - name: Package release files
        shell: pwsh
        run: |
          $version = ([xml](Get-Content BgOptimizer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "release/BgOptimizer-$version-win-x64-portable.zip" -CompressionLevel Optimal
          Copy-Item installer/Output/*.exe release/
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content release/SHA256SUMS.txt

      # Signed proof of which commit and workflow produced each file. Not for pull requests (forks get no token).
      # Verify a download with: gh attestation verify <file> --repo Aleks108-heaven/windows-background-optimizer
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.exe

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BgOptimizer-Release
          path: release/
          if-no-files-found: error
