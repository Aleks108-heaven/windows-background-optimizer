name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish artifact
        run: dotnet publish --no-restore --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BgOptimizer
          path: publish/
